[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pod-loader-rpc"
version = "0.5.1"
description = "Loads jobs into the lingua harness and drives them over RPC"
# 3.9 because that is what ships on macOS and what this actually runs on — every module
# imports under it, since the annotations are all postponed via __future__. Claiming 3.10
# made "pip install -e ." fail outright on the maintainer's own machine.
requires-python = ">=3.9"
# Runs on a laptop or a control-plane VPS, never inside a pod. The execution engine moved
# to pod-harness, which depends on nothing of ours; this package depends on nothing of
# ours either. The two communicate through four contracts and no shared code: the job spec
# schema, the event/status schema, the environment variable names, and the /v1 endpoints.
#
# One exception crosses the line by design: paths.py, the storage layout. Workloads import
# it because the layout is a pipeline concern that evolves with the pipelines. The harness
# deliberately does NOT, because a frozen harness must not carry knowledge that changes.
dependencies = [
    "requests>=2.31",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# pod_loader.app: the client for pod-control's app API, and its in-memory fake.
app = ["httpx>=0.27"]

[project.scripts]
runctl = "runctl:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
